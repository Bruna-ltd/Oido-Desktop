[package]
name = "oido-desktop"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
chacha20poly1305 = "0.11.0"
# Local date and time for the agent's context; no timezone database needed (a UTC offset is enough).
base64 = "0.22.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "7.0.0"
getrandom = "0.4.3"
keyring-core = "1.0.1"
# Rune is pre-release: pin a rev of `dev` (never rewritten) and bump it deliberately.
rune = { git = "https://github.com/anomalyco/rune", rev = "a7f276c3630f85a06a0230295da4d2bd172d8d3b" }
# Components and app shell (sidebar, split view, toolbar). `markdown` renders agent replies; `mermaid` draws their diagrams and charts.
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "a7f276c3630f85a06a0230295da4d2bd172d8d3b", features = ["markdown", "mermaid"] }
# 0.39, not newer: it links the same SQLite library (libsqlite3-sys 0.37) as WhatsApp's session store
# below, and only one copy can be linked. Bump together with `whatsapp-rust`.
rusqlite = { version = "0.39", features = ["bundled"] }
# The SQLite linked is SQLCipher (system OpenSSL for its crypto), so WhatsApp's session file is
# encrypted with a key sealed like a token. A database opened without a key, like Oido's own, is
# plain SQLite as before.
libsqlite3-sys = { version = "0.37", features = ["bundled-sqlcipher"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.5.1"
uuid = { version = "1.29.1", features = ["v4"] }
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-async-io-crypto-rust"] }
zeroize = "1.9.1"
sha2 = "0.11"
percent-encoding = "2"
# Replies' Markdown turned into the HTML Telegram reads (the same version rune-kit renders with).
pulldown-cmark = { version = "0.13", default-features = false }
# Slack's Socket Mode: a WebSocket the app opens, so Slack needs no public address. Blocking, on a
# thread of its own like the rest; TLS through the rustls ureq already brings.
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
# WhatsApp as a channel: Oido linked as a device of a WhatsApp number by scanning a QR code
# (WhatsApp Web's protocol, unofficial). It runs on Tokio, on a thread of its own.
whatsapp-rust = { version = "0.7", default-features = false, features = ["tokio-runtime", "tokio-native", "tokio-transport", "ureq-client", "sqlite-storage"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "time", "macros"] }
# The session store's database connection, to key it (`PRAGMA key`) before anything else runs.
diesel = { version = "2.3", default-features = false, features = ["sqlite"] }
# The QR codes on the Channels screen: linking WhatsApp, and inviting someone to it.
qrcode = { version = "0.14", default-features = false }
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde"] }
croner = "4"
# The icon in the desktop bar's tray (StatusNotifierItem), on the zbus 5 and async-io the keyring already uses.
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
# Desktop notifications (org.freedesktop.Notifications): the same zbus the tray and keyring run on.
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
# Guardrails: the patterns that find secrets and risky commands before they reach a model or run.
regex = "1.13"

# Our copy of Rune (../rune, branch oido-wheel-notch): the upstream revision above with its scroll
# speed raised on Linux, where the system gives no acceleration: a mouse wheel notch scrolls 180
# points instead of 40, and a trackpad's pixels count 2.5 times. Drop this section when upstream
# lets the app set them, and keep the `rev` above in step with the copy's base when bumping Rune.
[patch."https://github.com/anomalyco/rune"]
rune = { path = "../rune/crates/rune" }
rune-kit = { path = "../rune/crates/rune-kit" }

[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "deny"

# Light optimization of our own code too: the view is rebuilt on every frame.
#
# `lto = "off"`: with any optimization rustc otherwise runs ThinLTO across a crate's codegen units,
# which renames symbols (`foo.llvm.<hash>`). An incremental rebuild can then link a reused object
# against a recompiled one that names the symbol differently, and the link fails with
# "undefined hidden symbol". Turning it off costs little speed and keeps rebuilds linking.
[profile.dev]
opt-level = 1
lto = "off"

# Dependencies are optimized more, and without debug info: the UI engine (rune) lays out and draws
# every frame, and unoptimized it takes 75 to 150 ms a frame, which makes scrolling crawl.
[profile.dev.package."*"]
opt-level = 3
debug = false
